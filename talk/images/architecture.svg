<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
  <title>Kiến trúc tổng thể: Registry, Git, Kargo, Argo CD, EKS và Karpenter</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- EKS cluster -->
  <rect x="900" y="10" width="290" height="380" rx="16" fill="#fffbeb" stroke="#ff9900" stroke-width="3"/>
  <text x="1045" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Amazon EKS cluster</text>

  <g stroke-width="2.5">
    <rect x="20"  y="40"  width="200" height="80" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="20"  y="270" width="200" height="100" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <rect x="300" y="120" width="220" height="160" rx="12" fill="#fae8ff" stroke="#a21caf"/>
    <rect x="600" y="120" width="220" height="160" rx="12" fill="#ffedd5" stroke="#ea580c"/>
    <rect x="925" y="60"  width="240" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="925" y="195" width="240" height="75"  rx="12" fill="#ccfbf1" stroke="#0d9488"/>
    <rect x="925" y="305" width="240" height="70"  rx="12" fill="#dcfce7" stroke="#16a34a"/>
  </g>

  <g text-anchor="middle" fill="#0f172a">
    <text x="120" y="75"  font-size="21" font-weight="700">Registry (ECR)</text>
    <text x="120" y="102" font-size="18">image mới từ CI</text>

    <text x="120" y="305" font-size="21" font-weight="700">Git repo</text>
    <text x="120" y="332" font-size="18">main + nhánh</text>
    <text x="120" y="354" font-size="18">stage/test, uat, prod</text>

    <text x="410" y="168" font-size="26" font-weight="700">Kargo</text>
    <text x="410" y="202" font-size="19">Warehouse, Freight</text>
    <text x="410" y="228" font-size="19">Stage, Promotion</text>
    <text x="410" y="254" font-size="19">(điều phối chặng)</text>

    <text x="710" y="168" font-size="26" font-weight="700">Argo CD</text>
    <text x="710" y="202" font-size="19">đọc Git, sync</text>
    <text x="710" y="228" font-size="19">lên cluster</text>
    <text x="710" y="254" font-size="19">(người giao hàng)</text>

    <text x="1045" y="92"  font-size="21" font-weight="700">Pod app</text>
    <text x="1045" y="120" font-size="18">namespace test, uat, prod</text>
    <text x="1045" y="146" font-size="18">hết chỗ thì Pod Pending</text>

    <text x="1045" y="228" font-size="21" font-weight="700">Karpenter</text>
    <text x="1045" y="253" font-size="18">NodePool + EC2NodeClass</text>

    <text x="1045" y="336" font-size="21" font-weight="700">Node EC2</text>
    <text x="1045" y="360" font-size="18">Spot / on-demand</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="3">
    <!-- 1 registry -> kargo -->
    <path d="M220,80 L410,80 L410,116" marker-end="url(#a)"/>
    <!-- 2 kargo -> git commit -->
    <path d="M380,282 L380,305 L224,305" marker-end="url(#a)"/>
    <!-- 3 git -> argo -->
    <path d="M224,350 L710,350 L710,284" marker-end="url(#a)"/>
    <!-- 4 kargo -> argo -->
    <line x1="522" y1="200" x2="596" y2="200" marker-end="url(#a)"/>
    <!-- 5 argo -> pods -->
    <path d="M822,170 L872,170 L872,110 L921,110" marker-end="url(#a)"/>
    <!-- pods -> karpenter -> node -->
    <line x1="1045" y1="162" x2="1045" y2="191" marker-end="url(#a)"/>
    <line x1="1045" y1="272" x2="1045" y2="301" marker-end="url(#a)"/>
  </g>

  <!-- step badges -->
  <g font-size="17" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="330" cy="66" r="14" fill="#0f172a"/><text x="330" y="72">1</text>
    <circle cx="300" cy="323" r="14" fill="#0f172a"/><text x="300" y="329">2</text>
    <circle cx="500" cy="332" r="14" fill="#0f172a"/><text x="500" y="338">3</text>
    <circle cx="559" cy="178" r="14" fill="#0f172a"/><text x="559" y="184">4</text>
    <circle cx="872" cy="140" r="14" fill="#0f172a"/><text x="872" y="146">5</text>
  </g>
  <g font-size="17" fill="#475569">
    <text x="352" y="70">image mới</text>
    <text x="320" y="327">commit manifest</text>
    <text x="520" y="336">Argo CD kéo từ Git</text>
  </g>
</svg>
